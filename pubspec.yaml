name: sportflix
description: "Application mobile pour regarder les chaines de sport en francais"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  media_kit: 1.2.6
  media_kit_video: 1.3.1
  media_kit_libs_video: 1.0.7
  http: ^1.2.2
  shared_preferences: ^2.3.4
  intl: ^0.19.0
  startapp_sdk: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "launcher"
  ios: false
  image_path: "assets/icon/app_icon_full.png"
  adaptive_icon_background: "#0A0E0A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon_foreground.png
    - assets/icon/app_icon_full.png
    - assets/icon/sportflix_appbar.png
