name: Build Flutter APK

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Build APK (release) with appcompat patch loop
        run: |
          # patch en arrière-plan pendant que Gradle tourne
          (while true; do
            find ~/.gradle -name "values.xml" -path "*appcompat*" -exec sed -i 's/#6680cbc4/#80000000/gI' {} \; 2>/dev/null
            find build -path "*merged.dir/values/values.xml" -exec sed -i 's/#6680cbc4/#80000000/gI' {} \; 2>/dev/null
            sleep 0.3
          done) &
          PATCH_PID=$!
          echo "patch loop pid $PATCH_PID"
          # lance le build
          flutter build apk --release || (kill $PATCH_PID; exit 1)
          kill $PATCH_PID || true
          echo "release built"

      - name: Build APK (debug) with patch loop
        run: |
          (while true; do
            find ~/.gradle -name "values.xml" -path "*appcompat*" -exec sed -i 's/#6680cbc4/#80000000/gI' {} \; 2>/dev/null
            find build -path "*merged.dir/values/values.xml" -exec sed -i 's/#6680cbc4/#80000000/gI' {} \; 2>/dev/null
            sleep 0.3
          done) &
          PATCH_PID=$!
          flutter build apk --debug || (kill $PATCH_PID; exit 1)
          kill $PATCH_PID || true

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sportflix-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: sportflix-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
