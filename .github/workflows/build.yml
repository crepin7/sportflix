name: Build Flutter APK

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Clean corrupted Gradle transforms (play-services-basement values-be bug)
        run: |
          rm -rf ~/.gradle/caches/*/transforms/*/transformed/play-services-basement-* 2>/dev/null || true
          find ~/.gradle/caches -name "sedeUMuXc" -delete 2>/dev/null || true
          find ~/.gradle/caches -path "*play-services-basement*values-be*" -type f ! -name "*.xml" -delete 2>/dev/null || true

      - name: Build APK (release)
        run: |
          set +e
          (while true; do
            find ~/.gradle/caches -path "*appcompat*values.xml" -exec sed -i 's/#6680cbc4/#80000000/gI' {} \; 2>/dev/null || true
            find . -path "*appcompat*values.xml" -exec sed -i 's/#6680cbc4/#80000000/gI' {} \; 2>/dev/null || true
            sleep 0.1
          done) &
          PATCH_PID=$!
          set -e
          flutter build apk --release
          STATUS=$?
          kill $PATCH_PID || true
          exit $STATUS

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sportflix-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          # Quota org limité : garde 7 jours pour ne plus saturer le stockage
          retention-days: 7
