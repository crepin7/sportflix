name: Build Flutter APK

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Build APK (release)
        run: |
          set +e
          (while true; do
            find ~/.gradle -name "values.xml" -exec sed -i 's/#6680cbc4/#80000000/gI' {} \; 2>/dev/null || true
            find . -name "values.xml" -exec sed -i 's/#6680cbc4/#80000000/gI' {} \; 2>/dev/null || true
            sleep 0.05
          done) &
          PATCH_PID=$!
          set -e
          flutter build apk --release
          STATUS=$?
          kill $PATCH_PID || true
          exit $STATUS

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sportflix-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
